name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  schema:
    name: Schema + duplicate-id check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run validator
        run: node scripts/validate.mjs

  hf-urls:
    name: Hugging Face URL reachability (warn-only)
    needs: schema
    runs-on: ubuntu-latest
    # Only run on PRs — no need to hammer HF on every push to main.
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: HEAD every gguf URL
        run: node scripts/verify-hf-urls.mjs
